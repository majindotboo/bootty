# Older runners can inherit sibling capture pipes on macOS and report false leaks.
nextest-version = "0.9.145"

# Tests that use real processes, PTYs, sockets, or filesystems can wedge instead of
# failing, and an unbounded test stalls the whole run — one hung test held a
# workspace run open for 22 minutes. Report a test as slow after 30s and kill it
# once it has been slow four times over, so a wedge costs two minutes, not a run.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "100ms", result = "fail" }
