[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.8.1"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# GPUI's foreground futures hold its thread-bound contexts by design, and a future that must be
# Send already fails to compile where it is spawned.
future_not_send = "allow"
# Bootty names independent flags, such as modifier keys, cell styles and capabilities, as bool
# fields; bitflags would lose the names and enums only fit flags that exclude each other.
struct_excessive_bools = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
ciborium = "0.2"
# The settings window edits config.toml; JSON highlighting for keymap.json is built in.
gpui-kit = { version = "0.9.0", features = ["tree-sitter-toml"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
unicode-segmentation = "1.13.3"
url = "2.5.8"
chrono = "0.4.45"
ab_glyph = "0.2"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
async-channel = "2"
assert_fs = "1.1.4"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
derive_more = { version = "2.1.1", default-features = false, features = [
  "deref",
  "deref_mut",
] }
getrandom = "0.4"
fontdb = "0.24"
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed" }
image = { version = "0.25", default-features = false }
iconflow = { version = "2.1", features = [
  "pack-bootstrap",
  "pack-lucide",
  "pack-phosphor",
  "pack-tabler",
] }
indoc = "2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "575ed6b8ceb79ffaf247ecf7e34333876b0d5be4", features = [
  "png",
  "log",
] }
memchr = "2.8"
regex = "1"
mslnk = "0.1.8"
notify-rust = "4.18"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
num-traits = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSAccessibilityConstants",
  "NSAccessibilityProtocols",
  "NSApplication",
  "NSCursor",
  "NSDockTile",
  "NSEvent",
  "NSGraphics",
  "NSScreen",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "std",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSDate",
  "NSDateFormatter",
  "NSDictionary",
  "NSFormatter",
  "NSString",
  "NSValue",
  "NSURL",
  "NSGeometry",
  "objc2-core-foundation",
  "std",
] }
png = "0.18"
portable-pty = { git = "https://github.com/wezterm/wezterm.git", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
filedescriptor = { git = "https://github.com/wezterm/wezterm.git", rev = "e68a8ec27727fbbda15e07f0a0737cd5e16481f6" }
pretty_assertions = "1.4.1"
proptest = "1"
proptest-derive = "0.9"
keepawake = "0.6"
rstest = "0.28"
rustybuzz = "0.20"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", features = ["float_roundtrip"] }
signal-hook = "0.4"
smallvec = "1"
starship-battery = "0.12"
static_assertions = "1.1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
plist = "1.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
bytes = "1.12"
h2 = "0.4.20"
http = "1.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = "1.54.1"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-width = "0.2"
ureq = "3"
embed-resource = "3.0.12"
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }
winreg = "0.56"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
# Keep the normal edit/test cycle small.
debug = false
incremental = false
split-debuginfo = "off"

[profile.test]
debug = false
incremental = false
split-debuginfo = "off"

[profile.release]
lto = "thin"
strip = "symbols"
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.gpui-kit-assets]
debug-assertions = false

[profile.dev.package.rust-embed]
debug-assertions = false

[profile.test.package.gpui-kit-assets]
debug-assertions = false

[profile.test.package.rust-embed]
debug-assertions = false
