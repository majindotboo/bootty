[workspace]
resolver = "3"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.7.1"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
gpui-kit = { version = "0.6.6", features = ["tree-sitter-lua", "tree-sitter-toml"] }
fluent-bundle = "0.16"
unic-langid = "0.9"
unicode-segmentation = "1.13.3"
url = "2.5.8"
chrono = "0.4.45"
ab_glyph = "0.2"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
async-channel = "2"
assert_fs = "1.1.4"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
derive_more = { version = "2.1.1", default-features = false, features = [
  "deref",
  "deref_mut",
] }
getrandom = "0.4"
fontdb = "0.24"
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed" }
image = { version = "0.25", default-features = false }
iconflow = { version = "1", features = [
  "pack-bootstrap",
  "pack-lucide",
  "pack-phosphor",
  "pack-tabler",
] }
indoc = "2"
inventory = "0.3"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "5988a0b78b4aa804d1c12e66bbfe662bd97d81c0", features = [
  "png",
  "log",
] }
memchr = "2.8"
regex = "1"
mslnk = "0.1.8"
muda = "0.20"
tray-icon = { version = "0.25", default-features = false }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.18"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
num-traits = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSCursor",
  "NSEvent",
  "NSGraphics",
  "NSScreen",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSResponder",
  "NSView",
  "NSWindow",
  "std",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSDictionary",
  "NSString",
  "NSValue",
  "NSURL",
  "NSGeometry",
  "objc2-core-foundation",
  "std",
] }
png = "0.18"
portable-pty = { git = "https://github.com/wezterm/wezterm.git", rev = "2658f629cd7251ce63a1698f238da2585676aa4e" }
pretty_assertions = "1.4.1"
proptest = "1"
proptest-derive = "0.8.0"
# Keep Cargo.lock on rustix 1.1.4 until rmux-client stops importing rustix::runtime.
rmux-client = "0.10"
rmux-sdk = "0.10"
keepawake = "0.6"
rmux-ipc = "0.10"
rmux-os = "0.10"
rmux-proto = "0.10"
rmux-server = { version = "0.10", default-features = false }
rstest = "0.27"
rustybuzz = "0.20"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
smallvec = "1"
starship-battery = "0.11"
static_assertions = "1.1.0"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
plist = "1.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = "1.53.1"
toml_edit = { version = "0.25", features = ["serde"] }
unicode-width = "0.2"
ureq = "3"
embed-resource = "3.0.11"
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }
winreg = "0.56"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "limited"
# macOS would otherwise leave every codegen unit's object file in `target/debug/deps` forever: the
# executable's debug map points into them, so nothing ever removes them, and one rebuild of this
# workspace leaves hundreds behind. That directory is also where test binaries live, and the first
# CoreText call in a process enumerates the directory its executable sits in to look for bundled
# fonts — so an unbounded pile of objects turned into seconds of startup for every test that touches
# a font. Collect the debug info into one .dSYM per binary instead, which keeps debugging intact and
# leaves the directory bounded.
split-debuginfo = "packed"

[profile.profiling]
inherits = "release"
debug = "full"
lto = false
strip = false

[profile.release]
lto = "fat"
split-debuginfo = "off"

# Rust 1.97's macOS 27 toolchain can produce unloadable stripped proc-macro dylibs and then
# misreport them as missing crates (E0463). Build dependencies never ship in Bootty's bundle, so
# keep their Mach-O metadata intact while retaining the release profile for product artifacts.
[profile.release.build-override]
strip = false

[profile.daemon-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dynamic-release]
inherits = "release"
lto = false

[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.gpui-kit-assets]
debug-assertions = false

[profile.dev.package.rust-embed]
debug-assertions = false

[profile.dev.package.gpui-pre-util]
debug-assertions = false

[profile.test.package.gpui-kit-assets]
debug-assertions = false

[profile.test.package.rust-embed]
debug-assertions = false

[profile.test.package.gpui-pre-util]
debug-assertions = false
