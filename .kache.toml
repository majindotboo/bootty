# Kache caches rustc outputs by content. Bootty has no shared remote store, so
# developer machines and CI keep a local store; CI persists it through the
# GitHub Actions cache.
[cache]
local_store = "~/.cache/kache-bootty"
local_only = true
# Keep the content store and stale Cargo units bounded.
local_max_size = "10GiB"
auto_clean_unused_units_days = 1
clean_incremental = true
# Cache libraries; executables are cheap to relink.
cache_executables = false
