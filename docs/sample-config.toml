# Complete Bootty configuration sample.
# Copy to $XDG_CONFIG_HOME/bootty/config.toml, usually ~/.config/bootty/config.toml.
#
# This file intentionally lists every currently supported top-level setting and
# table. Unknown fields are rejected, and active keybind actions must be backed
# by executable Bootty behavior.

version = 1
locale = "en"

# Application lifecycle. These names and defaults follow Zed; the restored unit is a Bootty Space.
restore_on_startup = "last_session" # last_session, last_workspace, none
cli_default_open_behavior = "existing_window" # existing_window, new_window
default_open_behavior = "existing_window" # existing_window, new_window
when_closing_with_no_tabs = "platform_default" # platform_default, close_window, keep_window_open
on_last_window_closed = "platform_default" # platform_default, quit_app

# Includes are applied after this file, so local overrides can replace values
# below. The leading ? makes this include optional.
include = [
  "?local.toml",
  # "shared.toml",
]

# Built-ins today:
#   One Dark
#   One Light
#   TokyoNight Night
#   Gruvbox Dark
#
# User themes are loaded from themes/<name>.toml or themes/<name>/theme.toml
# next to this config file before falling back to the built-in catalog.
theme = "One Dark"

[window]
background-opacity = 1.0
background-image-opacity = 1.0
background-gradient-angle = 180.0
background-material = "opaque" # opaque, transparent, blurred, mica, mica-alt
# Lower background-opacity to reveal the image, gradient or desktop.
# background-image = "wallpaper.png" # relative to this configuration directory
# background-gradient-start = "#101828FF"
# background-gradient-end = "#304868FF"
# Title/fullscreen/decorations are live-reloaded where supported.
# Width/height and macOS titlebar style are startup/new-window settings.
title = "Bootty"
width = 1220
height = 760
# The style is retained when fullscreen is toggled off so the next toggle/restart restores it.
fullscreen = "native"
fullscreen-enabled = false
window-decoration = "auto" # Linux: client = Bootty controls, server/auto = system, none = borderless.
macos-titlebar-style = "transparent"
# Top offset reserved when the window covers a notched screen in fullscreen, so the sidebar and
# terminal clear the notch. Omitted (the default) auto-detects the notch height from the display's
# safe area; set a number to override.
# fullscreen-top-offset = 32
# Place fullscreen tabs beside the camera in the notch band. Set false to place them below it.
# An explicit fullscreen-top-offset overrides the reserved height.
# The notch strip uses the sidebar's fullscreen background.
fullscreen-tabs-in-notch = true
# Wrap overflow below the camera; false keeps one scrollable strip on the left.
fullscreen-tabs-wrap-at-notch = true

[font]
# Live-reloaded terminal text metrics.
family = [".ZedMono"] # Bundled Lilex, matching Zed's virtual font name.
size = 15
baseline-adjustment = 0 # Optional vertical text offset in logical pixels.
ui-family = [".ZedSans"] # Bundled IBM Plex Sans for all non-terminal UI.
ui-size = 16
# Named styles advertised by the terminal family, "auto" for relative weights,
# or false to use the base style. Missing named styles also use the base.
style-bold = "auto"
style-italic = "auto"
style-bold-italic = "auto"
# Optional fixed cell metric overrides; omit to derive from font size.
# cell-width = 10
# cell-height = 22
# Enabled by default: stretch row spacing slightly so the terminal grid fills the available height.
fit-cell-height = true

# Assign an available named style to each UI weight role. Automatic preserves
# the offset from the selected UI base style; false uses the base style.
[font.ui-weights]
thin = "auto"
extra-light = "auto"
light = "auto"
normal = "auto"
medium = "auto"
semibold = "auto"
bold = "auto"
extra-bold = "auto"
black = "auto"

[chrome]
tabs-use-session-color = true
left-dock-toggle = true
# Live-reloaded app chrome. The status bar has one layout: tabs at the left, the machine's
# state and the time at the right.
# In dark mode on notched fullscreen displays, use solid black for sidebar,
# status bar, and split dividers so the notch band blends into the screen.
notched-fullscreen-black-chrome = true
gap = 0
# Dim inactive panes by overlay opacity in the 0.0-1.0 range.
unfocused-sidebar-dim = 0.16
unfocused-terminal-dim = 0.0
# Dock separator appearance; the grab area is independent of the line width.
pane-divider-width = 1.0
# pane-divider-color = "#313244"

[chrome.tabs]
# Terminal and sidebar tabs share one appearance and close-button setting.
appearance = "segmented" # classic, underline, pill, outline, segmented
close-position = "right" # left or right
close-button = "always" # always, hover, hidden

[sidebar]
# Turn off for one flat list with project context on each session.
group-by-project = true
# Manual order is the default; recent-activity uses accepted session input.
sort-order = "manual"
# Sessions colors layer on top of the active theme.
# Any unset slot falls back to the theme-derived value.
# background = "#11131a"
# foreground = "#cdd6f4"
# selected = "#2a2f3d" # active session row tint
# hover = "#1e222c"
# border = "#313244" # edge border and footer separator
# Overall sidebar modules remain separate from the pieces rendered for every session.
# modules = ["sessions"]
# session-modules = ["diffs", "process", "directory", "branch", "ports", "progress"]

[multiplexer]
# The native mux server owns local or SSH-hosted terminals and survives app exit.
# [multiplexer.remote] selects an SSH host. WSL native panes remain unavailable.

[input]
# Preferred user overrides live in the identity-scoped keymap.json beside this
# file. It is a JSONC array of { context, use_key_equivalents,
# use_builtin_defaults, unbind, bindings } sections; comments and trailing
# commas are allowed. For example, keymap.json may contain:
#   [
#     {
#       "context": "Terminal",
#       "use_builtin_defaults": false,
#       "bindings": { "ctrl-k": "new_tab" }
#     },
#   ]
# Arrow, Vim and Emacs navigation defaults can be changed in the same keymap.
# Bootty resolves the preset and compatibility arrays below first, then applies
# Every preset binds Cmd+K to the command palette (Ctrl+Shift+K outside macOS).
# keymap.json last. Existing TOML arrays remain supported and live-reloaded; new
# edits should use the Keymap editor or keymap.json.
#
# Active keybinds in either layer must use executable Bootty actions. Unsupported
# actions are diagnosed instead of being silently accepted.
#
# Compatibility TOML trigger syntax:
#   modifiers: shift, ctrl/control, alt/opt/option, cmd/command/super
#   examples: cmd+shift+,, ctrl+c, alt+ArrowUp, shift+Tab
#   supported physical names today: KeyA, KeyB, KeyC, Digit0, ArrowUp,
#     ArrowDown, Quote, Enter, Tab, Backspace
#   single-character keys such as a, b, c, ,, /, = and named "space" are also accepted
#   flags: all:, global:, unconsumed:, performable:
#   sequences use > and chained actions use chain=
keybind = [
  # Common app/window actions.
  "clear",
  "cmd+shift+r=reload_config",
  "cmd+-=decrease_all_font_sizes:1",
  "cmd+==increase_all_font_sizes:1",
  "cmd++=increase_all_font_sizes:1",
  "cmd+0=reset_all_font_sizes",
  "alt+shift+scroll_up=increase_all_font_sizes:0.25",
  "alt+shift+scroll_down=decrease_all_font_sizes:0.25",
  "performable:cmd+v=paste_from_clipboard",
  "shift+Enter=text:\\n",
  "cmd+alt+n=new_window",
  "cmd+shift+w=close_window",
  "cmd+w=close_surface",
  "cmd+q=quit",
  "cmd+alt+ctrl+f=toggle_fullscreen",
  "cmd+n=new_mux_session",
  "cmd+p=session_picker",
  "cmd+o=toggle_sidebar_focus",
  "cmd+shift+j=focus_terminal",
  "cmd+shift+e=toggle_sidebar_visibility",
  "ctrl+tab=last_session",
  "ctrl+shift+Tab=last_session",
  "cmd+[=navigate_back",
  "cmd+]=navigate_forward",
  "cmd+shift+n=next_session",
  "cmd+shift+]=next_session",
  "cmd+shift+p=previous_session",
  "cmd+shift+[=previous_session",
  "cmd+shift+,=move_session:-1",
  "cmd+shift+.=move_session:1",
  "cmd+1=select_session:1",
  "cmd+2=select_session:2",
  "cmd+3=select_session:3",
  "cmd+4=select_session:4",
  "cmd+5=select_session:5",
  "cmd+6=select_session:6",
  "cmd+7=select_session:7",
  "cmd+8=select_session:8",
  "cmd+9=select_session:9",
]

# Sidebar-local keybinds apply only while the sidebar owns keyboard focus.
# Enter activates the hovered session and returns focus to the terminal.
sidebar-keybind = [
  "Escape=focus_terminal",
  "Enter=activate_session",
  "j=next_session",
  "ArrowDown=next_session",
  "ctrl+n=next_session",
  "k=previous_session",
  "ArrowUp=previous_session",
  "ctrl+p=previous_session",
]

# Hide the mouse pointer after terminal typing; moving the pointer shows it again.
hide-mouse-pointer-while-typing = true

# Copy a completed mouse selection to the system clipboard.
copy-on-select = false

# macOS Option-as-Meta terminal input. Values: none, left, right, both.
# Application shortcuts are independent; use left_alt/right_alt for sided bindings.
macos-option-as-alt = "both"

# Modifier remaps are live-reloaded and apply to GPUI and direct input paths.
# Supported sides include left/right shift, alt, ctrl, and command.
modifier-remap = [
  "right_alt=left_ctrl",
  # "right_command=left_alt",
]

[session]
bell = "visual" # off | visual | audio | both
command-notifications = "unfocused" # never | unfocused | always
command-notification-min-seconds = 10
shell-integration = false # optional hooks for new bash, zsh and fish PTYs
output-archives = false # private bounded previous-session snapshots
clipboard-write-hosts = "" # opt-in host keys: local ssh:user@host:22 wsl:Ubuntu
# Session settings apply to newly-created sessions; reload will not restart the
# current shell. Leave these unset unless you intentionally want Bootty to
# override the account login shell, inherited working directory, or environment.
# shell = "/opt/homebrew/bin/fish"
# working-directory = "/Users/alice/src/project"
# New worktrees go in <worktree-directory>/<repository>/<name> on the
# repository's host; ~ is that host's home. Unset uses
# ~/.local/share/bootty/worktrees, or %LOCALAPPDATA%\bootty\worktrees on Windows;
# Development builds use their own namespace in place of bootty.
# worktree-directory = "~/src/worktrees"
# What a new worktree's branch name starts with. A project's own prefix wins.
# branch-prefix = "bootty/"
# env = [
#   { name = "EDITOR", value = "nvim" },
# ]
# term = "xterm-bootty"
# colorterm = "truecolor"
# Ghostty Glyph Protocol APC handling. Enabled by default; disable if an app's
# custom glyph sequences cause compatibility issues.
glyph-protocol = true
scrollbar = "auto" # auto | hover | always | never

[cursor]
# Live-reloaded default used when applications reset the cursor style (CSI 0 q).
# style accepts: block, bar, underline, hollow-block.
style = "block"
blink = false
# Keep cursors steady and slightly dimmer outside the focused pane.
dim-inactive-pane = true

[diagnostics]
# Live-reloaded. Set to a writable path to record frame/status stability data.
stability-trace = "/tmp/bootty-stability.csv"

[colors]
# Terminal colors are overlaid on the selected theme and live-reloaded.
background = "#1e1e2e"
foreground = "#cdd6f4"
cursor = "#f5e0dc"
cursor-text = "#11111b"
selection-background = "#585b70"
selection-foreground = "#cdd6f4"

# Extended palette generation. When enabled, entries 16-255
# are generated from the base colors using CIELAB interpolation;
# explicitly listed palette entries are preserved.
palette-generate = false
palette-harmonious = false

# Up to 256 palette entries are accepted. The first 16 entries are the standard
# ANSI colors: black, red, green, yellow, blue, magenta, cyan, white, then
# bright black through bright white.
palette = [
  "#45475a", # black
  "#f38ba8", # red
  "#a6e3a1", # green
  "#f9e2af", # yellow
  "#89b4fa", # blue
  "#f5c2e7", # magenta
  "#94e2d5", # cyan
  "#bac2de", # white
  "#585b70", # bright black
  "#f38ba8", # bright red
  "#a6e3a1", # bright green
  "#f9e2af", # bright yellow
  "#89b4fa", # bright blue
  "#f5c2e7", # bright magenta
  "#94e2d5", # bright cyan
  "#a6adc8", # bright white

  # Optional extended palette entries 16-255 can be listed here.
  # "#f5e0dc",
  # "#cba6f7",
]
