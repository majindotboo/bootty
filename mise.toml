[tools]
rust = { version = "nightly", profile = "minimal", components = ["rustfmt", "clippy", "rust-analyzer"] }
# The pinned official Ghostty source needs Zig 0.17 for native Windows builds.
zig = "0.17.0"
"cargo:cargo-xwin" = "0.23.1"
"cargo:cargo-zigbuild" = "0.24.0"

[tools."http:ghostty-source"]
version = "3d07ef9e28c4af05065b9e2e546b8ac8f9b62df0"
url = "https://github.com/ghostty-org/ghostty/archive/{{ version }}.tar.gz"
checksum = "sha256:3949e4bf93f345c7729faecac6b9916aeb5a2b745de5671a7fe8d4725040046c"
strip_components = 1

[env]
GHOSTTY_SOURCE_DIR = { value = "{{ tools['http:ghostty-source'].path }}", tools = true }
ZIG = { value = "{{ tools.zig.path }}/zig", tools = true }

[tasks.build]
description = "Build the bootty app with dynamic local linkage; pass --static for distribution or --fast for fast-release"
run = "cargo run --quiet --locked -p xtasks -- build"

[tasks.launch]
description = "Build and launch this worktree's isolated BoottyDev app (packaged on macOS); args after -- are passed to Bootty"
run = "cargo run --quiet --locked -p xtasks -- launch"

[tasks.test]
description = "Run workspace tests with nextest"
run = "cargo nextest run"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy on the workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.pre-commit]
description = "Run the repository pre-commit checks"
run = "cargo run --quiet --locked -p xtasks -- pre-commit"

[tasks.bench]
description = "Validate and compile every benchmark; pass --ci-smoke or --quick to select a measured workflow"
run = "cargo run --quiet --locked -p xtasks -- benchmark suite"

[tasks.release]
description = "Prepare and push a release from main using a local release-notes file"
run = "cargo run --quiet --locked -p xtasks -- release prepare"

[tasks."release:validate-notes"]
description = "Validate release notes from a file or stdin"
run = "cargo run --quiet --locked -p xtasks -- release validate-notes"

[tasks."release:verify-tag"]
description = "Verify that a release tag matches the workspace version"
run = "cargo run --quiet --locked -p xtasks -- release verify-tag"

[tasks."release:rename-asset"]
description = "Rename a packaged asset to its public release name"
run = "cargo run --quiet --locked -p xtasks -- release rename-asset"

[tasks."release:tag"]
description = "Tag the workspace version and dispatch its release workflow"
run = "cargo run --quiet --locked -p xtasks -- release tag-and-dispatch"

[tasks."release:publish"]
description = "Publish a GitHub release from a tagged commit and asset directory"
run = "cargo run --quiet --locked -p xtasks -- release publish"

[tasks."daemon:build-all"]
description = "Build daemon assets for every target in the daemon target manifest"
run = "cargo run --quiet --locked -p xtasks -- daemon build-all"

[tasks."daemon:matrix"]
description = "Print the daemon target matrix for CI"
run = "cargo run --quiet --locked -p xtasks -- daemon matrix"

[tasks."daemon:build-one"]
description = "Build one daemon target using its CI runner policy"
run = "cargo run --quiet --locked -p xtasks -- daemon build-one"

[tasks."daemon:stage"]
description = "Stage one daemon target with its normalized artifact name"
run = "cargo run --quiet --locked -p xtasks -- daemon stage"

[tasks."daemon:verify"]
description = "Verify a complete staged daemon directory"
run = "cargo run --quiet --locked -p xtasks -- daemon verify"

[tasks."daemon:size"]
description = "Enforce the daemon artifact size budget"
run = "cargo run --quiet --locked -p xtasks -- daemon size"

[tasks.package]
description = "Package with the host daemon; pass --all-daemons for every remote target, --static for distribution, or --fast for fast-release"
run = "cargo run --quiet --locked -p xtasks -- package"

[tasks."package:dev"]
description = "Package this worktree's isolated BoottyDev application"
run = "cargo run --quiet --locked -p xtasks -- package --dev"

[tasks."package:windows"]
description = "Package the Windows zip from BOOTTY_DAEMON_OUTPUT_DIR; pass --static or --fast"
run = "cargo run --quiet --locked -p xtasks -- package"

[tasks.install]
description = "Package and install Bootty with the host daemon; pass --fast for fast-release"
run = "cargo run --quiet --locked -p xtasks -- install"

[tasks."sign:setup"]
description = "Create and trust the local macOS code-signing identity so permission grants survive reinstalls"
run = "cargo run --quiet --locked -p xtasks -- sign-setup"

[tasks."bench:record-replay"]
description = "Record a terminal replay fixture"
run = "cargo run --quiet --locked -p xtasks -- benchmark record-replay"

[tasks."bench:hostile-soak"]
description = "Run hostile terminal input soak benchmarks"
run = "cargo run --quiet --locked -p xtasks -- benchmark hostile-soak"

[tasks."bench:live-remote"]
description = "Capture live remote transport benchmark evidence"
run = "cargo run --quiet --locked -p xtasks -- benchmark live-remote"

[tasks."bench:power-thermal"]
description = "Capture power and thermal evidence around a command"
run = "cargo run --quiet --locked -p xtasks -- benchmark power-thermal"
