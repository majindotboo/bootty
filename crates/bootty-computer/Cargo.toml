[package]
name = "bootty-computer"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
base64.workspace = true
num-traits.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSGraphicsContext", "NSImage", "NSImageRep", "NSRunningApplication", "NSWorkspace", "libc", "objc2-core-graphics"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGEvent", "CGEventSource", "CGEventTypes", "CGGeometry", "CGImage", "CGRemoteOperation", "CGWindow", "libc", "std"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDate", "NSEnumerator", "NSError"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["libc", "SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi-proxies = "0.13"
zbus = "5.19"
x11rb = { version = "0.14", features = ["xtest"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
pretty_assertions.workspace = true
proptest.workspace = true
rstest.workspace = true
