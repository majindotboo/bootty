[package]
name = "bootty-mux"
edition.workspace = true
version.workspace = true

[features]
# Desktop composition needs terminal attachment and pane runtime policy. Keep this
# optional so the installed daemon can use mux providers and catalog policy without
# pulling Ghostty VT or local PTY support.
default = ["terminal-runtime"]
terminal-runtime = [
  "dep:bootty-terminal",
  "dep:derive_more",
]

[dependencies]
bootty-git = { path = "../bootty-git" }
bootty-config = { path = "../bootty-config" }
bootty-host = { path = "../bootty-host" }
bootty-control = { path = "../bootty-control" }
anyhow.workspace = true
base64.workspace = true
derive_more = { workspace = true, optional = true }
getrandom.workspace = true
inventory.workspace = true
rusqlite.workspace = true
rmux-client.workspace = true
rmux-ipc.workspace = true
rmux-os.workspace = true
rmux-proto.workspace = true
rmux-sdk.workspace = true
rmux-server.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
bootty-terminal = { path = "../bootty-terminal", optional = true }

[dev-dependencies]
assert_fs.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
proptest-derive.workspace = true
rstest.workspace = true
serde_json.workspace = true
static_assertions.workspace = true

[lints]
workspace = true
