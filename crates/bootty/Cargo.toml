[package]
autotests = false
name = "bootty"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
test = false

[[bin]]
name = "bootty"
test = false
path = "src/main.rs"

[dependencies]
bootty-os = { path = "../bootty-os" }
bootty-config = { path = "../bootty-config" }
bootty-host = { path = "../bootty-host" }
bootty-terminal = { path = "../bootty-terminal" }
bootty-ui = { path = "../bootty-ui" }
anyhow.workspace = true
base64.workspace = true
bootty-control = { path = "../bootty-control" }
bootty-mux = { path = "../bootty-mux" }
serde_json.workspace = true
clap.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "signal"] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bootty-test-support = { path = "../bootty-test-support" }
proptest.workspace = true
assert_fs.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
