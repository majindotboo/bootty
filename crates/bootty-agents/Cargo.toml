[package]
name = "bootty-agents"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
tempfile.workspace = true
anstyle-parse.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
png.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
markdown.workspace = true
num-traits.workspace = true
bootty-computer = { path = "../bootty-computer" }
bootty-control = { path = "../bootty-control" }
bootty-host = { path = "../bootty-host" }
bootty-git = { path = "../bootty-git" }
bootty-config = { path = "../bootty-config" }
bootty-write = { path = "../bootty-write" }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2.workspace = true
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { workspace = true }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["AVAudioBuffer", "AVAudioFormat", "AVAudioTypes", "std"] }
objc2-foundation = { workspace = true, features = ["NSError", "NSOperation"] }
objc2-speech = { version = "0.3", default-features = false, features = ["SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription", "block2", "objc2-avf-audio", "std"] }

[dev-dependencies]
bootty-test-support = { path = "../bootty-test-support" }
proptest.workspace = true
assert_fs.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true

[lints]
workspace = true
