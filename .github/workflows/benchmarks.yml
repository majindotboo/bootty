name: Nightly benchmarks

on:
  schedule:
    # 02:00 Pacific during standard time; acceptable overnight window year-round.
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_BENCH_DEBUG: 0

jobs:
  full-benchmark-reproduction:
    name: Full benchmark reproduction
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxdo-dev \
            pkg-config

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      # Kache caches rustc outputs by content; only main pushes publish the store.
      - name: Set up Kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          cache-key-prefix: bootty-nightly-benchmarks
          manifest-key: nightly-benchmarks
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false

      - name: Run full benchmark reproduction suite
        run: mise run bench -- --quick --output artifacts/benchmark-reproduction/overnight

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-reproduction-${{ github.sha }}
          path: artifacts/benchmark-reproduction/overnight
          if-no-files-found: ignore
