name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_BENCH_DEBUG: 0

jobs:
  rust-format:
    name: Rust fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Check formatting
        run: mise run fmt

  rust-validation:
    name: Rust validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxdo-dev \
            pkg-config

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Kache caches rustc outputs by content; only main pushes publish the store.
      - name: Set up Kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          cache-key-prefix: bootty-linux-validation
          manifest-key: linux-validation
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false

      - name: Run clippy
        run: mise run clippy

      - name: Run tests with nextest
        run: mise run test -- --no-fail-fast

      - name: Build release daemon
        if: github.event_name == 'pull_request'
        run: |
          mise run daemon:build-one -- x86_64-unknown-linux-gnu
          mise run daemon:size -- target/x86_64-unknown-linux-gnu/release/bootty-daemon

      - name: Compile and smoke benchmark suite
        run: mise run bench -- --ci-smoke --output artifacts/benchmark-reproduction/ci

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-reproduction-${{ github.sha }}
          path: artifacts/benchmark-reproduction/ci
          if-no-files-found: ignore

  rust-cross:
    name: Cross portable crates (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      - name: Install target toolchains
        run: |
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross gcc-mingw-w64-x86-64

      # Kache caches rustc outputs by content; only main pushes publish the store.
      - name: Set up Kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          cache-key-prefix: bootty-cross-${{ matrix.target }}
          manifest-key: cross-${{ matrix.target }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false

      - name: Cross-compile portable crates and daemon
        run: >
          cargo check
          -p bootty-daemon
          -p bootty-terminal
          --target ${{ matrix.target }}

  daemon-artifacts:
    name: Build daemon matrix
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/daemon-artifacts.yml

  native-app-bundles:
    name: Native app bundle (${{ matrix.name }})
    needs: daemon-artifacts
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-26
            artifact-name: bootty-macos-arm64
          - name: windows-x64
            runner: windows-2025
            artifact-name: bootty-windows-x64
          - name: linux-x64
            runner: ubuntu-24.04
            artifact-name: bootty-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Set up mise toolchain
        uses: jdx/mise-action@v5

      # Kache caches rustc outputs by content; only main pushes publish the store.
      - name: Set up Kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed
        with:
          cache-key-prefix: bootty-native-${{ matrix.name }}
          manifest-key: native-${{ matrix.name }}
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          pr-comment: false

      - name: Download daemon matrix
        uses: actions/download-artifact@v8
        with:
          pattern: daemon-*
          path: target/bootty-daemons
          merge-multiple: true

      - name: Package native app
        env:
          BOOTTY_STRICT_MACOS_ICON: "1"
          BOOTTY_DAEMON_OUTPUT_DIR: target/bootty-daemons
        run: mise run package

      - name: Upload native app bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
