[package]
name = "bootty-mobile"
version = "0.1.0"
edition = "2024"
publish = false

# Mobile does not pull in desktop PTYs, platform libraries, or packaging gates.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.23"
gpui-kit = { version = "=0.7.0", default-features = false, features = ["component"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vte = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245", default-features = false, features = ["video_player", "camera"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
pretty_assertions = "1.4.1"
proptest = "1"
rstest = "0.27"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = false
